name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'      # nightly rebuild keeps sitemap.xml fresh
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Single-page app fixes for GitHub Pages
        run: |
          node scripts/inject-head.js        # Google Search Console verification tag
          cp dist/index.html dist/404.html   # deep links like /match/123 load the app
          touch dist/.nojekyll               # lets the _expo folder be served
          # Give every public page its own real file so GitHub Pages answers 200 (not 404) and Google can index it
          for r in matches table news players stats calendar media awards tryouts shop season-review; do
            mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"
          done
      - name: Sitemap and robots.txt (GitHub Pages cannot rewrite URLs, so we save them as files)
        env:
          SB_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -H "Authorization: Bearer $SB_KEY" "$SB_URL/functions/v1/sitemap" -o dist/sitemap.xml || echo "sitemap not generated (set site_url and deploy the function)"
          curl -fsS -H "Authorization: Bearer $SB_KEY" "$SB_URL/functions/v1/robots" -o dist/robots.txt || echo "using the default robots.txt"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
